name: Validate dashboard
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build data-free standalone HTML
        run: python3 scripts/build.py
      - name: Verify build is committed
        run: git diff --exit-code -- index.html
      - name: Check privacy and structure
        run: node tests/public-artifact.cjs
      - name: Test parser and calculations
        run: npm test
      - name: Install pinned browser test runner
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regression with synthetic workbook
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
